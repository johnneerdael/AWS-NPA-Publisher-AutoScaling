name: Code Validation

on:
  push:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  thread-scaling:
    name: Publisher Thread Scaling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: pip install -r requirements-dev.txt
      - name: Run policy, adapter, collector, and Linux procfs tests
        run: python -m unittest discover -s tests -v
      - name: Validate supported CloudFormation add-on
        # The upstream template is historical and has a known E3712 error.
        run: cfn-lint templates/publisher-thread-scaling.yaml
      - name: Check formatting
        run: black --check scripts/publisher_metrics.py scripts/controller scripts/package-controller.py scripts/check-secrets.py scripts/generate-cloud-init.py tests
      - name: Check Python code
        run: flake8 --max-line-length=120 --extend-ignore=E203,W503 scripts/publisher_metrics.py scripts/controller scripts/package-controller.py scripts/check-secrets.py scripts/generate-cloud-init.py tests
      - name: Check security
        run: bandit -ll --skip B101 -r scripts/publisher_metrics.py scripts/controller scripts/package-controller.py scripts/check-secrets.py scripts/generate-cloud-init.py
      - name: Check installer shell syntax
        run: bash -n scripts/install-thread-metrics.sh
      - name: Build controller artifact from reviewed source
        run: python scripts/package-controller.py dist/controller.zip
      - name: Build provisioning user data
        run: python scripts/generate-cloud-init.py --group ci-publishers
      - name: Check patch whitespace
        run: git diff --check HEAD~1 HEAD
      - name: Upload controller artifact
        uses: actions/upload-artifact@v4
        with:
          name: publisher-thread-controller
          path: |
            dist/controller.zip
            dist/publisher-user-data.gz
            dist/publisher-user-data.yaml
            dist/publisher-user-data.launch-template.json

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'detect-secrets>=1.5,<2'
      - name: Scan source against the reviewed baseline
        run: python scripts/check-secrets.py
